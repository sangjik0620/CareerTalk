spring.application.name=CareerTalK

# Server
server.port=8080

# MySQL Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://finaldb.c5q82scoy4an.ap-northeast-2.rds.amazonaws.com:3306/finaldb
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# MyBatis
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=kr.co.ict.CAREERTALK.dto
mybatis.configuration.map-underscore-to-camel-case=true

# AWS S3
aws.s3.region=ap-northeast-2
aws.s3.bucket=careertalk-dev
aws.s3.base-prefix=careertalk
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email,https://www.googleapis.com/auth/user.phonenumbers.read,https://www.googleapis.com/auth/user.birthday.read
# Google People API
google.api.key=${GOOGLE_API_KEY}

# AI API Key
ai.api-key=${ANALYSIS_AI_API_KEY}
ai.api-url=https://api.openai.com/v1/responses

audio.analysis.base-url=http://localhost:8001

ai.model.name=gpt-5-nano
ai.model.version=2025-08-07
ai.prompt.version=v1.0

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=unducklife@gmail.com
spring.mail.password=xmeq emas sdax fxye
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 1. Naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8080/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email,nickname,mobile

# 2. Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Kakao OAuth2 Registration
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=account_email

# Kakao Provider Details
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id


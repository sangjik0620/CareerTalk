spring.application.name=CareerTalK

# Server
server.port=8080

# MySQL Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://finaldb.c5q82scoy4an.ap-northeast-2.rds.amazonaws.com:3306/finaldb
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# MyBatis
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=kr.co.ict.CAREERTALK.dto
mybatis.configuration.map-underscore-to-camel-case=true

# AWS S3
aws.s3.region=ap-northeast-2
aws.s3.bucket=careertalk-dev
aws.s3.base-prefix=careertalk
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

openai.api-key=${INTERVIEW_AI_API_KEY}

